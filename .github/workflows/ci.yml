name: CI

permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  test:
    # Both supported platforms: if a change breaks one, CI says so.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo test
