[package]
name = "devterminal"
version = "1.1.0"
edition = "2021"
description = "Terminal Workspace Manager for Linux and Windows"
license = "GPL-3.0-or-later"
repository = "https://github.com/tomgutgar/DevTerminal"

[[bin]]
name = "devc"
path = "src/main.rs"

# ponytail: single crate; split into a per-module workspace when compile times justify it
# No bollard/octocrab/kube-rs on purpose: the philosophy is to wrap the existing CLIs (docker, gh, kubectl)
[dependencies]
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
anyhow = "1"
sysinfo = "0.32"
# Just for the dashboard date: `date +%A` does not exist on Windows and std
# knows nothing about time zones.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
